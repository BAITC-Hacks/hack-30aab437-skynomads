services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
      - "7001:7001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
